<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Fitness - Progress</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #16171A;
      --surface: #212226;
      --surface-strong: #2A2C31;
      --ink: #F2F0EA;
      --ink-soft: #D1D0CB;
      --muted: #55585F;
      --text-muted: #AEB0B7;
      --line: #55585F;
      --line-strong: #777A83;
      --lime: #E8402C;
      --lime-deep: #B92F21;
      --fuel: #F5C24C;
      --fuel-deep: #C7921F;
      --coral: #FF8A78;
      --success: #65D391;
      --radius: 14px;
      --radius-lg: 20px;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; background: var(--canvas); color: var(--ink); font-family: "DM Sans", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
    .page { width: min(100% - 32px, 820px); margin: 0 auto; padding: 42px 0 70px; }
    .brand { margin-bottom: 54px; color: var(--ink); font-size: 14px; font-weight: 800; letter-spacing: -.02em; }
    .brand:before { width: 8px; height: 8px; display: inline-block; margin: 0 7px 1px 0; border-radius: 50%; background: var(--lime-deep); content: ""; }
    .brand span { color: var(--text-muted); font-weight: 500; }
    .header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .eyebrow { color: var(--text-muted); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, p { margin: 0; }
    h1, h2 { letter-spacing: -.045em; }
    h1 { margin-top: 7px; font-size: clamp(52px, 9vw, 72px); line-height: .88; }
    .subtitle { max-width: 480px; margin-top: 14px; color: var(--text-muted); font-size: 14px; line-height: 1.4; }
    .range { display: flex; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: rgba(33, 34, 38, .75); }
    .range button { min-width: 48px; min-height: 32px; padding: 6px 9px; border: 0; border-radius: 7px; background: transparent; color: var(--text-muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
    .range button.active { background: var(--surface-strong); color: var(--ink); }
    .insight { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; padding: 15px 17px; border: 1px solid rgba(232, 64, 44, .34); border-radius: var(--radius); background: linear-gradient(110deg, rgba(232, 64, 44, .12), var(--surface) 58%); }
    .insight-icon { width: 33px; height: 33px; display: grid; flex: 0 0 auto; place-items: center; border-radius: 10px; background: rgba(232, 64, 44, .16); color: var(--lime); font-size: 17px; }
    .insight p { color: var(--ink-soft); font-size: 13px; font-weight: 600; line-height: 1.4; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .stat { min-height: 137px; padding: 15px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .stat-icon { width: 30px; height: 30px; display: grid; place-items: center; margin-bottom: 13px; border-radius: 9px; background: rgba(232, 64, 44, .12); color: var(--lime); font-size: 16px; }
    .stat:nth-child(2) .stat-icon { background: rgba(255, 138, 120, .12); color: var(--coral); }
    .stat:nth-child(3) .stat-icon { background: rgba(245, 194, 76, .12); color: var(--fuel); }
    .stat-label { color: var(--text-muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .stat strong { margin-top: 4px; overflow: hidden; font-size: clamp(20px, 3vw, 29px); line-height: 1.05; text-overflow: ellipsis; white-space: nowrap; }
    .stat small { margin-top: auto; color: var(--text-muted); font-size: 10px; line-height: 1.3; }
    .card { margin-top: 15px; padding: 19px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
    .card h2 { font-size: 22px; line-height: 1.05; }
    .card-heading p { margin-top: 5px; color: var(--text-muted); font-size: 11px; line-height: 1.35; }
    .card-meta { flex: 0 0 auto; color: var(--text-muted); font-size: 10px; font-weight: 800; letter-spacing: .06em; text-align: right; text-transform: uppercase; }
    .activity-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
    .activity-day { display: grid; justify-items: center; gap: 5px; color: var(--text-muted); font-size: 10px; font-weight: 700; }
    .activity-day small { color: var(--muted); font-size: 10px; }
    .activity-dot { width: 35px; height: 35px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--surface-strong); color: var(--text-muted); font-size: 11px; font-weight: 800; }
    .activity-dot.complete { border-color: var(--lime); background: var(--lime); color: var(--ink); }
    .activity-dot.today { border-color: var(--lime-deep); box-shadow: 0 0 0 3px rgba(232, 64, 44, .16); }
    .focus-bar { height: 11px; display: flex; gap: 2px; overflow: hidden; margin: 5px 0 17px; border-radius: 999px; background: var(--surface-strong); }
    .focus-bar span:first-child { border-radius: 999px 0 0 999px; }
    .focus-bar span:last-child { border-radius: 0 999px 999px 0; }
    .legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px 18px; }
    .legend-item { min-width: 0; display: grid; grid-template-columns: 9px minmax(0, 1fr); column-gap: 7px; align-items: center; }
    .legend-item i { width: 8px; height: 8px; grid-row: span 2; border-radius: 50%; }
    .legend-item strong { overflow: hidden; color: var(--ink-soft); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .legend-item small { color: var(--text-muted); font-size: 10px; }
    .chart { height: 230px; width: 100%; }
    .chart svg { width: 100%; height: 100%; overflow: visible; }
    .chart-grid { stroke: var(--muted); stroke-width: 1; opacity: .65; }
    .chart-label { fill: var(--text-muted); font-size: 10px; }
    .bars { display: flex; align-items: flex-end; justify-content: space-around; gap: 10px; height: 185px; padding: 8px 8px 0 40px; border-bottom: 1px solid var(--line); border-left: 1px solid transparent; background: repeating-linear-gradient(to bottom, transparent 0, transparent 45px, rgba(85, 88, 95, .52) 46px); }
    .bar-group { height: 100%; flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
    .bar { width: 16px; min-height: 3px; border-radius: 4px 4px 0 0; }
    .bar-labels { display: flex; justify-content: space-around; padding: 8px 8px 0 40px; color: var(--text-muted); font-size: 10px; }
    .bar-labels span { flex: 1; text-align: center; }
    .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 31px 0 13px; }
    .section-heading h2 { margin-top: 7px; font-size: 29px; line-height: .96; }
    .section-heading > span { color: var(--text-muted); font-size: 11px; }
    .movement-list { display: grid; gap: 8px; }
    .movement { width: 100%; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) 86px auto 16px; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); text-align: left; }
    .movement:hover { border-color: var(--line-strong); background: var(--surface-strong); }
    .movement-copy { min-width: 0; }
    .movement-copy strong, .movement-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .movement-copy strong { font-size: 14px; }
    .movement-copy span { margin-top: 3px; color: var(--text-muted); font-size: 10px; text-transform: capitalize; }
    .sparkline { width: 86px; height: 35px; }
    .movement-value { min-width: 69px; text-align: right; }
    .movement-value strong, .movement-value span { display: block; }
    .movement-value strong { font-size: 13px; }
    .movement-value span { margin-top: 3px; color: var(--lime); font-size: 10px; font-weight: 700; white-space: nowrap; }
    .chevron { color: var(--muted); font-size: 18px; }
    .duo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
    .duo .card { margin-top: 0; }
    .metric-switcher { display: flex; gap: 4px; margin-bottom: 8px; }
    .metric-switcher button { padding: 5px 8px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text-muted); font-size: 10px; font-weight: 800; }
    .metric-switcher button.active { border-color: var(--line); background: var(--surface-strong); color: var(--ink); }
    .body-current { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .body-current strong { font-size: 27px; line-height: 1; }
    .body-current span, .note { color: var(--text-muted); font-size: 10px; }
    .body-line { height: 105px; margin-top: 14px; }
    .body-line polyline { fill: none; stroke: var(--lime); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .body-line circle { fill: var(--fuel); stroke: var(--lime); stroke-width: 2; }
    .macro-total { display: flex; align-items: baseline; gap: 6px; margin: 5px 0 19px; }
    .macro-total strong { font-size: 28px; line-height: 1; }
    .macro-total span { color: var(--text-muted); font-size: 10px; }
    .macro-row { display: grid; gap: 5px; margin: 11px 0; }
    .macro-row > div:first-child { display: flex; justify-content: space-between; gap: 10px; }
    .macro-row strong { color: var(--ink-soft); font-size: 11px; }
    .macro-row span { color: var(--text-muted); font-size: 10px; }
    .macro-track { height: 6px; overflow: hidden; border-radius: 999px; background: var(--surface-strong); }
    .macro-track span { height: 100%; display: block; border-radius: inherit; }
    .note { display: block; margin-top: 10px; line-height: 1.35; }
    .sheet-backdrop { position: fixed; inset: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: center; padding: 20px; background: rgba(0, 0, 0, .72); backdrop-filter: blur(4px); }
    .sheet { width: min(100%, 530px); max-height: 88vh; overflow: auto; padding: 24px; border: 1px solid var(--line-strong); border-radius: var(--radius-lg) var(--radius-lg) 12px 12px; background: var(--surface); box-shadow: 0 22px 60px rgba(0, 0, 0, .48); }
    .sheet-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 19px; }
    .sheet h2 { margin-top: 6px; font-size: 36px; line-height: .9; }
    .close { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--text-muted); font-size: 20px; }
    .sheet-intro { color: var(--text-muted); font-size: 13px; }
    .sheet-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 18px 0; }
    .sheet-summary div { padding: 13px; border-radius: 8px; background: var(--surface-strong); }
    .sheet-summary span { display: block; color: var(--text-muted); font-size: 10px; }
    .sheet-summary strong { display: block; margin-top: 4px; font-size: 20px; }
    .sheet-summary div:last-child strong { color: var(--lime); }
    .history { display: grid; gap: 7px; }
    .history div { display: grid; grid-template-columns: 1fr auto 55px; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
    .history span, .history small { color: var(--text-muted); font-size: 11px; }
    .history strong, .history small { text-align: right; }
    .sheet-actions { display: flex; justify-content: flex-end; margin-top: 19px; }
    .button { min-height: 42px; padding: 9px 16px; border: 1px solid var(--lime); border-radius: 8px; background: var(--lime); color: var(--ink); font-size: 12px; font-weight: 800; }
    @media (max-width: 650px) {
      .page { padding-top: 25px; }
      .brand { margin-bottom: 40px; }
      .header { align-items: flex-start; flex-direction: column; gap: 17px; }
      .range { align-self: stretch; }
      .range button { flex: 1; }
      .stat-grid { gap: 7px; }
      .stat { min-height: 124px; padding: 11px; }
      .stat-icon { width: 27px; height: 27px; margin-bottom: 10px; }
      .stat strong { font-size: 18px; }
      .stat small { font-size: 9px; }
      .card { padding: 16px; }
      .card-heading h2 { font-size: 20px; }
      .activity-days { gap: 3px; }
      .activity-dot { width: 32px; height: 32px; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 7px; }
      .movement { grid-template-columns: minmax(0, 1fr) 64px auto 14px; gap: 7px; padding: 12px 10px; }
      .sparkline { width: 64px; }
      .movement-value { min-width: 57px; }
      .movement-value strong { font-size: 11px; }
      .movement-value span { font-size: 9px; }
      .duo { grid-template-columns: 1fr; gap: 0; }
      .duo .card + .card { margin-top: 12px; }
    }
    @media (max-width: 390px) {
      .page { width: min(100% - 24px, 820px); }
      .stat { padding: 9px; }
      .stat-label { font-size: 9px; }
      .stat strong { font-size: 16px; }
      .stat small { font-size: 8px; }
      .movement { grid-template-columns: minmax(0, 1fr) 52px auto 12px; }
      .sparkline { width: 52px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const colors = ['var(--lime)', 'var(--fuel)', 'var(--coral)', 'var(--lime-deep)', 'var(--success)', 'var(--fuel-deep)'];
    const data = {
      insight: 'Bench Press is moving forward: your recorded best is up 4.5 kg across the selected period.',
      weekly: [
        { label: 'Mon', date: '16', done: true }, { label: 'Tue', date: '17', done: true },
        { label: 'Wed', date: '18', done: false }, { label: 'Thu', date: '19', done: true },
        { label: 'Fri', date: '20', done: false, today: true }, { label: 'Sat', date: '21', done: false },
        { label: 'Sun', date: '22', done: false }
      ],
      stats: { workouts: '8', workoutsSub: 'completed in the last 30 days', load: '8,420 kg', loadSub: '+12% vs prior period', fuel: '2,240 kcal', fuelSub: '142g protein average' },
      muscles: [
        { name: 'Chest', percent: 32, sets: 18 }, { name: 'Back', percent: 28, sets: 16 },
        { name: 'Quads', percent: 22, sets: 12 }, { name: 'Shoulders', percent: 18, sets: 10 }
      ],
      volume: [
        { label: 'May 26', values: [310, 260, 190, 120] }, { label: 'Jun 2', values: [420, 350, 220, 160] },
        { label: 'Jun 9', values: [360, 390, 250, 130] }, { label: 'Jun 16', values: [470, 410, 280, 190] }
      ],
      movements: [
        { name: 'Bench Press', muscle: 'chest', weight: '82.5 kg', change: '+4.5 kg', trend: [78, 78, 80, 80, 82.5], reps: '5 reps at current best' },
        { name: 'Back Squat', muscle: 'quads', weight: '105 kg', change: '+7.5 kg', trend: [97.5, 100, 100, 102.5, 105], reps: '6 reps at current best' },
        { name: 'Lat Pulldown', muscle: 'back', weight: '72.5 kg', change: 'Baseline', trend: [70, 70, 72.5], reps: '10 reps at current best' }
      ],
      body: { current: '78.9 kg', date: 'Jun 20', change: '-1.6 kg across available snapshots', points: [80.5, 80.1, 79.6, 79.2, 78.9] },
      macros: { calories: '2,240', protein: 142, carbs: 230, fat: 65 }
    };

    function Icon({ name }) {
      const paths = {
        spark: <><path d="m12 3 1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3Z" /></>,
        dumbbell: <><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M1 11v2M23 11v2M8 5v14M16 5v14" /></>,
        arrow: <><path d="M5 12h14M13 6l6 6-6 6" /></>,
        fuel: <><path d="M4 3h10v18H4zM14 7h3l3 3v7a2 2 0 0 1-4 0v-5h-2M7 7h4" /></>,
        scale: <><path d="M12 3v18M3 7l9-4 9 4M6 12l-3 7h6l-3-7zM18 12l-3 7h6l-3-7z" /></>
      };
      return <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{paths[name]}</svg>;
    }

    function ProgressPrototype() {
      const [range, setRange] = useState('30D');
      const [metric, setMetric] = useState('weight');
      const [selected, setSelected] = useState(null);
      return <main className="page">
        <div className="brand">Simple <span>Fitness</span></div>
        <header className="header"><div><div className="eyebrow">Patterns, not pressure</div><h1>Progress</h1><p className="subtitle">A clearer view of the work you have kept visible.</p></div><div className="range">{['7D', '30D', '56D'].map(item => <button className={range === item ? 'active' : ''} onClick={() => setRange(item)} key={item}>{item}</button>)}</div></header>
        <div className="insight"><span className="insight-icon"><Icon name="spark" /></span><p>{data.insight}</p></div>
        <div className="stat-grid"><Stat icon="dumbbell" label="Workouts" value={data.stats.workouts} detail={data.stats.workoutsSub} /><Stat icon="arrow" label="Training load" value={data.stats.load} detail={data.stats.loadSub} /><Stat icon="fuel" label="Daily fuel" value={data.stats.fuel} detail={data.stats.fuelSub} /></div>
        <section className="card"><Heading title="Weekly activity" copy="Keep the rhythm visible, without chasing a perfect week." meta="8 day streak" /><div className="activity-days">{data.weekly.map(day => <div className="activity-day" key={day.label + day.date}><span className={'activity-dot' + (day.done ? ' complete' : '') + (day.today ? ' today' : '')}>{day.done ? '✓' : day.label[0]}</span><span>{day.label}</span><small>{day.date}</small></div>)}</div></section>
        <section className="card"><Heading title="Muscle focus" copy="Completed working sets across the last seven days." meta="56 sets" /><div className="focus-bar">{data.muscles.map((muscle, index) => <span key={muscle.name} style={{ width: muscle.percent + '%', background: colors[index] }} />)}</div><div className="legend">{data.muscles.map((muscle, index) => <div className="legend-item" key={muscle.name}><i style={{ background: colors[index] }} /><strong>{muscle.name}</strong><small>{muscle.percent}% · {muscle.sets} sets</small></div>)}</div></section>
        <section className="card"><Heading title="Training load" copy="Weekly volume from completed sets with weight and reps." meta={range === '30D' ? 'The last 30 days' : 'Selected period'} /><div className="chart"><div className="bars">{data.volume.map(week => <div className="bar-group" key={week.label}>{week.values.map((value, index) => <span className="bar" key={index} style={{ height: value / 3 + 'px', background: colors[index] }} />)}</div>)}</div><div className="bar-labels">{data.volume.map(week => <span key={week.label}>{week.label}</span>)}</div></div></section>
        <div className="section-heading"><div><div className="eyebrow">The details behind the pattern</div><h2>Strength progression</h2></div><span>Most recorded movements</span></div>
        <div className="movement-list">{data.movements.map(movement => <button className="movement" key={movement.name} onClick={() => setSelected(movement)}><div className="movement-copy"><strong>{movement.name}</strong><span>{movement.muscle} · {movement.reps}</span></div><Sparkline points={movement.trend} /><div className="movement-value"><strong>{movement.weight}</strong><span>{movement.change}</span></div><span className="chevron">›</span></button>)}</div>
        <div className="duo"><section className="card"><Heading title="Body trend" copy="Snapshots over the selected period." meta="" /><div className="metric-switcher">{['weight', 'bmi', 'body fat'].map(item => <button className={(metric === item || (metric === 'weight' && item === 'weight')) ? 'active' : ''} onClick={() => setMetric(item)} key={item}>{item}</button>)}</div><div className="body-current"><strong>{metric === 'weight' ? data.body.current : metric === 'bmi' ? '24.6' : '18.2%'}</strong><span>{data.body.date}</span></div><Sparkline points={data.body.points} large /><span className="note">{data.body.change}</span></section><section className="card"><Heading title="Daily fuel" copy="Average confirmed meal estimates." meta="" /><div className="macro-total"><strong>{data.macros.calories}</strong><span>kcal per logged day</span></div><Macro label="Protein" value={data.macros.protein} color="var(--lime)" total={data.macros.protein * 4 + data.macros.carbs * 4 + data.macros.fat * 9} /><Macro label="Carbs" value={data.macros.carbs} color="var(--fuel)" total={data.macros.protein * 4 + data.macros.carbs * 4 + data.macros.fat * 9} /><Macro label="Fat" value={data.macros.fat} color="var(--coral)" total={data.macros.protein * 4 + data.macros.carbs * 4 + data.macros.fat * 9} /><span className="note">12 logged days · estimates are for direction, not precision</span></section></div>
        {selected && <MovementSheet movement={selected} onClose={() => setSelected(null)} />}
      </main>;
    }

    function Stat({ icon, label, value, detail }) { return <div className="stat"><span className="stat-icon"><Icon name={icon} /></span><span className="stat-label">{label}</span><strong>{value}</strong><small>{detail}</small></div>; }
    function Heading({ title, copy, meta }) { return <div className="card-heading"><div><h2>{title}</h2><p>{copy}</p></div>{meta && <span className="card-meta">{meta}</span>}</div>; }
    function Sparkline({ points, large }) { const min = Math.min(...points); const max = Math.max(...points); const spread = max - min || 1; const coords = points.map((point, index) => `${points.length === 1 ? 50 : index / (points.length - 1) * 100},${34 - (point - min) / spread * 27}`).join(' '); return <svg className={large ? 'sparkline body-line' : 'sparkline'} viewBox="0 0 100 40" aria-hidden="true"><polyline points={coords} /><>{large && points.map((point, index) => <circle key={index} cx={points.length === 1 ? 50 : index / (points.length - 1) * 100} cy={34 - (point - min) / spread * 27} r="2.3" />)}</></svg>; }
    function Macro({ label, value, color, total }) { const share = value * (label === 'Fat' ? 9 : 4) / total * 100; return <div className="macro-row"><div><strong>{label}</strong><span>{value}g</span></div><div className="macro-track"><span style={{ width: share + '%', background: color }} /></div></div>; }
    function MovementSheet({ movement, onClose }) { return <div className="sheet-backdrop"><div className="sheet" role="dialog" aria-modal="true"><div className="sheet-heading"><div><div className="eyebrow">Exercise breakdown</div><h2>{movement.name}</h2></div><button className="close" onClick={onClose} aria-label="Close">×</button></div><p className="sheet-intro">Heaviest completed set recorded for each workout in the selected period.</p><div className="sheet-summary"><div><span>Current best</span><strong>{movement.weight}</strong></div><div><span>Change</span><strong>{movement.change}</strong></div></div><div className="history">{movement.trend.map((value, index) => <div key={index}><span>Recorded session {index + 1}</span><strong>{value} kg</strong><small>completed</small></div>)}</div><div className="sheet-actions"><button className="button" onClick={onClose}>Close</button></div></div></div>; }
    ReactDOM.render(<ProgressPrototype />, document.getElementById('root'));
  </script>
</body>
</html>
